services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # Public HTTP for Coolify reverse proxy (domain → service frontend, port 3000).
    # Do not publish a host port (conflicts with other apps / Coolify).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-file:../storage/db/zokher.db}
      STORAGE_DIR: ${STORAGE_DIR:-./storage}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
    volumes:
      - zokher-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  zokher-storage:
